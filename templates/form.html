{% extends "base.html" %}

{% block title %}Feedback Form{% endblock %}

{% block content %}

<h2>Send us a Feedback</h2>

<form method="POST" action="{{ url_for('form') }}">

    <label for="name">Name:</label><br>

    <input type="text"
           name="name"
           id="name"
           placeholder="Enter your name">

    <br><br>

    <input type="submit" value="Submit Feedback">

</form>

{% endblock %}
